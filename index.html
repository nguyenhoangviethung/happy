            // ==========================================================================
            // CẤU HÌNH BIẾN CHỦ ĐỀ CHÍNH CHO BACKEND TÍCH HỢP (SỐ TỪ 1 ĐẾN 10)
            // Ví dụ trong Laravel/Blade: let THEME = 1;
            // ==========================================================================
            let THEME = (typeof window.THEME !== 'undefined') ? window.THEME : 1;
            let customTitle = (typeof window.dataLetterV14?.data?.title !== 'undefined' && window.dataLetterV14?.data?.title !== null)
                ? String(window.dataLetterV14.data.title).trim()
                : (document.getElementById('displayTitle')?.getAttribute('title') || document.getElementById('displayTitle')?.textContent?.trim() || '');

            // Hàm tìm kiếm chủ đề thông minh (hỗ trợ cả Số 1..10, index 0..9, Chuỗi "1".."10", hoặc ID "pink", "blue")
            function findTheme(input) {
                if (typeof input === 'number') {
                    if (input === 0) return THEMES[0];
                    return THEMES.find(t => t.theme === input) || THEMES[input - 1] || THEMES[0];
                }
                if (typeof input === 'string') {
                    const trimmed = input.trim();
                    if (trimmed === '0') return THEMES[0];
                    const num = parseInt(trimmed, 10);
                    if (!isNaN(num) && num >= 1 && num <= THEMES.length) {
                        return THEMES.find(t => t.theme === num) || THEMES[num - 1] || THEMES[0];
                    }
                    const byId = THEMES.find(t => t.id.toLowerCase() === trimmed.toLowerCase());
                    if (byId) return byId;
                }
                return THEMES[0];
            }

            let currentTheme = THEMES[0];

            // Đổi theme và cập nhật toàn bộ: Nắp, Nơ lụa, Ngón tay hint, Mây, Biểu tượng & Text
            function applyTheme(themeInput) {
                const found = findTheme(themeInput);
                if (!found) return;
                currentTheme = found;
                THEME = found.theme;
                window.THEME = found.theme;

                document.body.className = '';
                document.body.classList.add(`theme-${found.id}`, `theme-${found.theme}`);

                const metaTheme = document.getElementById('metaThemeColor');
                if (metaTheme) {
                    metaTheme.content = found.colorDot;
                }

                // 1. Cập nhật gradient mặt ngoài nắp thư (flapFrontGrad)
                const f1 = document.getElementById('flapFrontStop1');
                const f2 = document.getElementById('flapFrontStop2');
                const f3 = document.getElementById('flapFrontStop3');
                if (f1 && f2 && f3 && found.flapFront) {
                    f1.setAttribute('stop-color', found.flapFront[0]);
                    f2.setAttribute('stop-color', found.flapFront[1]);
                    f3.setAttribute('stop-color', found.flapFront[2]);
                }

                // 2. Cập nhật gradient mặt trong nắp thư (flapBackGrad)
                const b1 = document.getElementById('flapBackStop1');
                const b2 = document.getElementById('flapBackStop2');
                if (b1 && b2 && found.flapBack) {
                    b1.setAttribute('stop-color', found.flapBack[0]);
                    b2.setAttribute('stop-color', found.flapBack[1]);
                }

                // 3. Cập nhật gradient mây bồng bềnh (cloudGrad)
                const c1 = document.getElementById('cloudStop1');
                const c2 = document.getElementById('cloudStop2');
                const c3 = document.getElementById('cloudStop3');
                const c4 = document.getElementById('cloudStop4');
                if (c1 && c2 && c3 && c4 && found.cloud) {
                    c1.setAttribute('stop-color', found.cloud[0]);
                    c2.setAttribute('stop-color', found.cloud[1]);
                    c3.setAttribute('stop-color', found.cloud[2]);
                    c4.setAttribute('stop-color', found.cloud[3]);
                }

                // 4. CẬP NHẬT GRADIENT NGÓN TAY HINT (tapHandGrad)
                const th1 = document.getElementById('tapHandStop1');
                const th2 = document.getElementById('tapHandStop2');
                const th3 = document.getElementById('tapHandStop3');
                if (th1 && th2 && th3 && found.tapHand) {
                    th1.setAttribute('stop-color', found.tapHand[0]);
                    th2.setAttribute('stop-color', found.tapHand[1]);
                    th3.setAttribute('stop-color', found.tapHand[2]);
                }

                // 5. CẬP NHẬT GRADIENT NƠ LỤA TRÊN CON DẤU (bowSilkGrad)
                const bw1 = document.getElementById('bowStop1');
                const bw2 = document.getElementById('bowStop2');
                const bw3 = document.getElementById('bowStop3');
                if (bw1 && bw2 && bw3 && found.bowSilk) {
                    bw1.setAttribute('stop-color', found.bowSilk[0]);
                    bw2.setAttribute('stop-color', found.bowSilk[1]);
                    bw3.setAttribute('stop-color', found.bowSilk[2]);
                }

                // 5.1. CẬP NHẬT MÀU NGÔI SAO LẤP LÁNH Ở GÓC BAO THƯ (env-sparkle-star)
                const sparkleStarPath = document.querySelector('.env-sparkle-star path');
                if (sparkleStarPath && found.sparkleColor) {
                    sparkleStarPath.setAttribute('fill', found.sparkleColor);
                }
                document.documentElement.style.setProperty('--env-sparkle', found.sparkleColor || '#fbbf24');

                // 6. Cập nhật tiêu đề & xử lý trường hợp ẩn tiêu đề
                const headerTitleBox = document.getElementById('headerTitleBox');
                const titleToUse = (typeof customTitle !== 'undefined' && customTitle !== null && customTitle !== '') 
                    ? customTitle 
                    : (found.title || '');

                if (window.SmartTitleEngine) {
                    SmartTitleEngine.apply(titleToUse);
                } else {
                    const displayTitleEl = document.getElementById('displayTitle');
                    if (displayTitleEl) {
                        displayTitleEl.textContent = titleToUse;
                    }
                }

                // Tự động ẩn tiêu đề và hiện hoa văn trang trí nếu SHOW_TITLE=false, hoặc theme có showTitle=false, hoặc title rỗng
                const isTitleHidden = SHOW_TITLE === false ||
                    found.showTitle === false ||
                    !titleToUse ||
                    String(titleToUse).trim() === '';

                if (headerTitleBox) {
                    headerTitleBox.classList.toggle('is-title-hidden', isTitleHidden);
                }

                // Cập nhật biểu tượng tâm xoay tròn trong hoa văn trang trí theo từng chủ đề
                const ornamentCenterSpin = document.getElementById('titleOrnamentCenterSpin');
                if (ornamentCenterSpin) {
                    const iconKey = found.particleType || 'heart';
                    ornamentCenterSpin.innerHTML = ORNAMENT_ICONS[iconKey] || ORNAMENT_ICONS.heart;
                }

                const btnActionLabel = document.getElementById('btnActionLabel');
                if (btnActionLabel) btnActionLabel.textContent = found.btnText;

                // 7. Cập nhật biểu tượng con dấu
                const sealWrap = document.getElementById('sealEmblemWrap');
                if (sealWrap) sealWrap.innerHTML = found.sealIcon;
                const btnActionIconWrap = document.getElementById('btnActionIconWrap');
                if (btnActionIconWrap) btnActionIconWrap.innerHTML = found.btnIcon;

                // 8. Reset hạt tương tác theo loại hạt và màu sắc chủ đề mới
                if (Array.isArray(particles) && particles.length > 0) {
                    particles.forEach(p => p.reset(true));
                }
            }

            // Nhận theme qua query parameter (ví dụ: ?theme=3 hoặc ?theme=blue)
            const urlParams = new URLSearchParams(window.location.search);
            const paramTheme = urlParams.get('theme');
            if (paramTheme) {
                THEME = paramTheme;
            }

            // Biến điều khiển ẩn/hiện tiêu đề letter-title (có thể truyền ?show_title=0 hoặc ?hide_title=1 hoặc ?no_title=1)
            let SHOW_TITLE = true;
            if (urlParams.has('show_title')) {
                SHOW_TITLE = urlParams.get('show_title') !== '0' && urlParams.get('show_title') !== 'false';
            } else if (urlParams.has('hide_title')) {
                SHOW_TITLE = urlParams.get('hide_title') === '0' || urlParams.get('hide_title') === 'false';
            } else if (urlParams.has('no_title')) {
                SHOW_TITLE = false;
            }

            function setTitleVisible(visible) {
                SHOW_TITLE = !!visible;
                const headerTitleBox = document.getElementById('headerTitleBox');
                if (headerTitleBox) {
                    headerTitleBox.classList.toggle('is-title-hidden', !SHOW_TITLE);
                }
            }

            /* ==========================================================================
               SMART TITLE ENGINE - HỆ THỐNG XỬ LÝ & ĐIỀU PHỐI TIÊU ĐỀ THÔNG MINH
               Tự động tính toán độ dài, tỉ lệ hiển thị, ngắt dòng nghệ thuật và co giãn kích thước
               ========================================================================== */
            const SmartTitleEngine = {
                escapeHtml(str) {
                    return String(str || '')
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '”')
                        .replace(/'/g, '’');
                },

                formatTitleText(rawText) {
                    if (rawText == null) return '';
                    let text = String(rawText).trim();
                    if (!text) return '';
                    // Hỗ trợ ngắt dòng chủ động bằng ký tự | hoặc \n
                    if (text.includes('|')) {
                        return text.split('|').map(p => this.escapeHtml(p.trim())).filter(Boolean).join('<br>');
                    }
                    if (text.includes('\n')) {
                        return text.split('\n').map(p => this.escapeHtml(p.trim())).filter(Boolean).join('<br>');
                    }
                    return this.escapeHtml(text);
                },

                adjustTypography() {
                    const titleEl = document.getElementById('displayTitle');
                    const headerBox = document.getElementById('headerTitleBox');
                    const fixedHeader = document.querySelector('.letter-fixed-header');
                    if (!titleEl) return;

                    const plainText = (titleEl.textContent || titleEl.innerText || '').trim();
                    const charCount = plainText.length;

                    // Reset các class typography cũ
                    titleEl.classList.remove('title-short', 'title-medium', 'title-long', 'title-extra-long');
                    if (headerBox) headerBox.classList.remove('has-long-title');
                    if (fixedHeader) fixedHeader.classList.remove('has-long-title');

                    if (!plainText) return;

                    // Tooltip đọc trọn vẹn 100% nếu tiêu đề bị ellipsis
                    titleEl.setAttribute('title', plainText);

                    // Phân cấp thông minh theo độ dài ký tự
                    if (charCount <= 18) {
                        titleEl.classList.add('title-short');
                    } else if (charCount <= 36) {
                        titleEl.classList.add('title-medium');
                        if (headerBox) headerBox.classList.add('has-long-title');
                        if (fixedHeader) fixedHeader.classList.add('has-long-title');
                    } else if (charCount <= 65) {
                        titleEl.classList.add('title-long');
                        if (headerBox) headerBox.classList.add('has-long-title');
                        if (fixedHeader) fixedHeader.classList.add('has-long-title');
                    } else {
                        titleEl.classList.add('title-extra-long');
                        if (headerBox) headerBox.classList.add('has-long-title');
                        if (fixedHeader) fixedHeader.classList.add('has-long-title');
                    }

                    // Tự động tính toán lại thanh cuộn thư vì độ cao header có thể thay đổi
                    if (typeof updateScrollMetrics === 'function') {
                        requestAnimationFrame(updateScrollMetrics);
                    }
                },

                apply(newTitle) {
                    const titleEl = document.getElementById('displayTitle');
                    if (!titleEl) return;
                    if (newTitle != null) {
                        titleEl.innerHTML = this.formatTitleText(newTitle);
                    }
                    this.adjustTypography();
                }
            };

            window.SmartTitleEngine = SmartTitleEngine;

            /* ==========================================================================
               SMART MESSAGE TYPOGRAPHY - HỆ THỐNG ĐIỀU PHỐI CỠ CHỮ THƯ THÔNG MINH
               Tự động nhận diện phông viết tay (Script/Cursive), đo x-height quang học,
               co giãn tỉ lệ theo dung lượng nội dung và kích thước khung hình thiết bị
               ========================================================================== */
            const SmartMessageTypography = {
                fitContent() {
                    const letterPaper = document.getElementById('letterPaper');
                    const msgEl = document.getElementById('displayMessage');
                    if (!msgEl || !letterPaper) return;

                    const text = (msgEl.innerText || msgEl.textContent || '').trim();
                    const charCount = text.length;

                    // 1. Nhận diện phông chữ viết tay / Cursive Script
                    const computedStyle = window.getComputedStyle(msgEl);
                    const fontFamily = (computedStyle.fontFamily || '').toLowerCase();
                    const SCRIPT_KEYWORDS = /(dancing|ephesis|playwrite|pacifico|great vibes|allura|alex brush|sacramento|caveat|marck|satisfy|courgette|kalam|fondamento|cookie|parisienne|petit formal|bad script|pinyon|rouge|cedarville|homemade apple|reenie|shadows into|zeyada|qwitcher|cursive|handwriting|script|brush|calligraph|vintage|pen|lobster|italianno)/i;

                    let isScript = SCRIPT_KEYWORDS.test(fontFamily);

                    // Phép đo quang học x-height thực tế bằng test probe nếu chưa khớp từ khóa
                    if (!isScript && document.body && text) {
                        try {
                            const probe = document.createElement('span');
                            probe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;font-size:100px;font-family:' + (computedStyle.fontFamily || 'inherit') + ';visibility:hidden;contain:strict;';
                            probe.textContent = 'x';
                            document.body.appendChild(probe);
                            const xH = probe.offsetHeight;
                            probe.textContent = 'H';
                            const capH = probe.offsetHeight;
                            document.body.removeChild(probe);
                            if (capH > 0 && (xH / capH) < 0.46) {
                                isScript = true;
                            }
                        } catch (e) {}
                    }

                    letterPaper.classList.toggle('is-script-font', isScript);
                    msgEl.classList.toggle('is-script-font', isScript);

                    // 2. Kích thước viewport
                    const isLandscape = window.innerHeight <= 520 && window.innerWidth > window.innerHeight;
                    const isMobile = window.innerWidth <= 640 || isLandscape;

                    // 3. Phân cấp độ dài nội dung
                    letterPaper.classList.remove('msg-short', 'msg-medium', 'msg-long', 'msg-very-long');

                    let targetSize = 20; // px
                    let targetLineHeight = '1.85';

                    if (charCount < 150) {
                        letterPaper.classList.add('msg-short');
                        if (isScript) {
                            targetSize = isLandscape ? 22 : (isMobile ? 26 : 28.5);
                            targetLineHeight = '1.80';
                        } else {
                            targetSize = isLandscape ? 19 : (isMobile ? 22 : 24);
                            targetLineHeight = '1.92';
                        }
                    } else if (charCount < 380) {
                        letterPaper.classList.add('msg-medium');
                        if (isScript) {
                            targetSize = isLandscape ? 20.5 : (isMobile ? 24 : 25.5);
                            targetLineHeight = '1.76';
                        } else {
                            targetSize = isLandscape ? 17.5 : (isMobile ? 20 : 21.5);
                            targetLineHeight = '1.88';
                        }
                    } else if (charCount < 750) {
                        letterPaper.classList.add('msg-long');
                        if (isScript) {
                            targetSize = isLandscape ? 19 : (isMobile ? 22 : 23.5);
                            targetLineHeight = '1.74';
                        } else {
                            targetSize = isLandscape ? 16.5 : (isMobile ? 18.5 : 19.5);
                            targetLineHeight = '1.84';
                        }
                    } else {
                        letterPaper.classList.add('msg-very-long');
                        if (isScript) {
                            targetSize = isLandscape ? 17.5 : (isMobile ? 20 : 21);
                            targetLineHeight = '1.70';
                        } else {
                            targetSize = isLandscape ? 15.5 : (isMobile ? 17 : 18);
                            targetLineHeight = '1.78';
                        }
                    }

                    // Gán trực tiếp CSS Custom Property cho .letter-paper và .letter-message
                    letterPaper.style.setProperty('--letter-fit-size', targetSize + 'px');
                    letterPaper.style.setProperty('--letter-fit-line', targetLineHeight);
                    msgEl.style.setProperty('--letter-fit-size', targetSize + 'px');
                    msgEl.style.setProperty('--letter-fit-line', targetLineHeight);

                    // Cập nhật lại thanh cuộn thư
                    if (typeof updateScrollMetrics === 'function') {
                        requestAnimationFrame(updateScrollMetrics);
                    }
                }
            };

            window.SmartMessageTypography = SmartMessageTypography;

            function setTitle(newText) {
                customTitle = newText != null ? String(newText) : '';
                if (window.SmartTitleEngine) {
                    SmartTitleEngine.apply(customTitle);
                } else {
                    const displayTitleEl = document.getElementById('displayTitle');
                    if (displayTitleEl) {
                        displayTitleEl.textContent = customTitle;
                    }
                }
                const hasText = !!customTitle && String(customTitle).trim() !== '';
                setTitleVisible(hasText);
            }

            function setMessage(newMsg) {
                const displayMsgEl = document.getElementById('displayMessage');
                if (!displayMsgEl || newMsg == null) return;

                let text = '';
                if (Array.isArray(newMsg)) {
                    text = newMsg.join('\n\n');
                } else {
                    text = String(newMsg);
                }

                const paragraphs = text.split(/\n\s*\n/).map(p => p.trim()).filter(p => p.length > 0);
                if (paragraphs.length > 0) {
                    displayMsgEl.innerHTML = paragraphs.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
                } else if (text.trim()) {
                    displayMsgEl.innerHTML = `<p>${text.trim()}</p>`;
                }
                if (window.SmartMessageTypography) {
                    SmartMessageTypography.fitContent();
                } else if (typeof updateScrollMetrics === 'function') {
                    requestAnimationFrame(updateScrollMetrics);
                }
            }

            // Đọc cấu hình từ window.dataLetterV14 nếu có
            const letterDataCfg = window.dataLetterV14?.data;
            if (letterDataCfg) {
                if (typeof letterDataCfg.theme !== 'undefined' && letterDataCfg.theme !== null) {
                    THEME = letterDataCfg.theme;
                }
                if (typeof letterDataCfg.title !== 'undefined' && letterDataCfg.title !== null) {
                    setTitle(letterDataCfg.title);
                }
                if (typeof letterDataCfg.hide_title !== 'undefined') {
                    SHOW_TITLE = !letterDataCfg.hide_title;
                    setTitleVisible(SHOW_TITLE);
                } else if (letterDataCfg.title !== undefined) {
                    const hasText = !!letterDataCfg.title && String(letterDataCfg.title).trim() !== '';
                    setTitleVisible(hasText);
                }
                if (typeof letterDataCfg.messages !== 'undefined' && letterDataCfg.messages !== null) {
                    setMessage(letterDataCfg.messages);
                }
            }

            // Khởi tạo typography cho tiêu đề và thân thư hiện tại
            SmartTitleEngine.adjustTypography();
            SmartMessageTypography.fitContent();

            // Kích hoạt chủ đề khởi tạo (theo biến THEME)
            applyTheme(THEME);

            // Expose ra window để backend, live editor hoặc console có thể gọi trực tiếp
            window.setTheme = applyTheme;
            window.THEME = THEME;
            window.SHOW_TITLE = SHOW_TITLE;
            window.setTitleVisible = setTitleVisible;
            window.setTitle = setTitle;
            window.setMessage = setMessage;

            // Lắng nghe cập nhật động từ iframe / Live Preview editor (postMessage)
            window.addEventListener('message', function(event) {
                if (!event.data) return;
                const d = event.data;
                if (d.type === 'UPDATE_LETTER' || d.type === 'LOVELOOM_UPDATE' || d.action === 'update' || d.template === 'letter-v14') {
                    const payload = d.data || d.payload || d;
                    if (payload.theme !== undefined && payload.theme !== null) applyTheme(payload.theme);
                    if (payload.title !== undefined) setTitle(payload.title);
                    if (payload.hide_title !== undefined) setTitleVisible(!payload.hide_title);
                    if (payload.messages !== undefined || payload.message !== undefined) {
                        setMessage(payload.messages || payload.message);
                    }
                }
            });

            /* ==========================================================================
               C. ÂM THANH HỘP NHẠC TỔNG HỢP (OFFLINE, UNLOCK TỨC THÌ TRÊN IOS/ANDROID)
               ========================================================================== */
            let audioCtx = null;
            let isPlayingMusic = false;
            let musicTimer = null;

            function initAudio() {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume().catch(() => {});
                }
            }

            // Kích hoạt audio bus tức thì ngay từ chạm đầu tiên (iOS Safari / Android AudioContext Autoplay Policy)
            function unlockAudioGesture() {
                initAudio();
                if (audioCtx) {
                    try {
                        const buf = audioCtx.createBuffer(1, 1, 22050);
                        const src = audioCtx.createBufferSource();
                        src.buffer = buf;
                        src.connect(audioCtx.destination);
                        src.start(0);
                    } catch (e) {}
                }
                ['touchstart', 'touchend', 'pointerdown', 'click'].forEach(evt => {
                    window.removeEventListener(evt, unlockAudioGesture, true);
                });
            }
            ['touchstart', 'touchend', 'pointerdown', 'click'].forEach(evt => {
                window.addEventListener(evt, unlockAudioGesture, {
                    capture: true,
                    passive: true
                });
            });

            function playPopSound() {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(420, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(780, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.24, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            }

            function playChimeSound() {
                initAudio();
                if (!audioCtx) return;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.38);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.08);
                    osc.stop(audioCtx.currentTime + idx * 0.08 + 0.4);
                });
            }

            const melodyNotes = [
                392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 587.33, 523.25,
                493.88, 523.25, 440.00, 392.00, 440.00, 493.88, 523.25, 392.00
            ];
            let noteStep = 0;

            function playMusicBoxNote() {
                if (!isPlayingMusic || !audioCtx || isTabHidden) return;
                const freq = melodyNotes[noteStep % melodyNotes.length];
                noteStep++;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.7);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.72);
                musicTimer = setTimeout(playMusicBoxNote, 520);
            }

            function startBackgroundMusic() {
                if (isPlayingMusic) return;
                initAudio();
                isPlayingMusic = true;
                playMusicBoxNote();
            }

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    isTabHidden = true;
                    if (rafId) cancelAnimationFrame(rafId);
                    clearTimeout(musicTimer);
                    if (audioCtx && audioCtx.state === 'running') {
                        audioCtx.suspend().catch(() => {});
                    }
                } else {
                    isTabHidden = false;
                    lastTouchTime = Date.now();
                    if (audioCtx && audioCtx.state === 'suspended' && isPlayingMusic) {
                        audioCtx.resume().catch(() => {});
                    }
                    if (isPlayingMusic) {
                        clearTimeout(musicTimer);
                        musicTimer = setTimeout(playMusicBoxNote, 250);
                    }
                    cancelAnimationFrame(rafId);
                    rafId = requestAnimationFrame(renderLoop);
                }
            });

            /* ==========================================================================
               D. VẬT LÝ & LOGIC MỞ/ĐÓNG THƯ 60-120FPS HOÀN HẢO (KHÔNG GIẬT KHUNG HÌNH)
               ========================================================================== */
            const stage = document.getElementById('stage');
            const envFloatingRig = document.getElementById('envFloatingRig');
            const envelopeBox = document.getElementById('envelopeBox');
            const envInner = document.getElementById('envInner');
            const envFloorShadow = document.getElementById('envFloorShadow');
            const flapTop = document.getElementById('flapTop');
            const sealBtn = document.getElementById('sealBtn');
            const hintPill = document.getElementById('hintPill');
            const letterPaper = document.getElementById('letterPaper');
            const letterScrollBody = document.getElementById('letterScrollBody');
            const btnCloseLetter = document.getElementById('btnCloseLetter');
            const letterBackdrop = document.getElementById('letterBackdrop');
            const letterBottomFade = document.getElementById('letterBottomFade');
            const scrollDownCue = document.getElementById('scrollDownCue');
            const readingProgressTrack = document.getElementById('readingProgressTrack');
            const readingProgressBar = document.getElementById('readingProgressBar');
            let isOpen = false;
            let isAnimating = false;

            // ==========================================================================
            // HỆ THỐNG AUTO-SCROLL THÔNG MINH & CHỈ BÁO NỘI DUNG CUỘN (CHUẨN UX HỆ THỐNG LỚN)
            // ==========================================================================
            let autoScrollActive = false;
            let autoScrollRafId = null;
            let autoScrollTimer = null;
            let isUserInteracting = false;
            let wheelIdleTimer = null;
            let accumulatedScroll = 0;
            let lastRafTime = 0;
            const SCROLL_SPEED_PX_SEC = 28; // Tốc độ cuộn êm đềm tự nhiên (≈ 28px/giây)
            const INITIAL_IDLE_DELAY = 3200; // Đợi 3.2s sau khi mở để người đọc ngắm tiêu đề & đoạn đầu
            const RESUME_IDLE_DELAY = 3600; // Tự động cuộn tiếp sau 3.6s nếu người dùng không chạm

            // Cập nhật các chỉ báo trực quan (Fade Masks, Progress Bar, Cue Indicator)
            function updateScrollMetrics() {
                if (!letterScrollBody) return;
                const scrollTop = letterScrollBody.scrollTop;
                const scrollHeight = letterScrollBody.scrollHeight;
                const clientHeight = letterScrollBody.clientHeight;
                const maxScroll = scrollHeight - clientHeight;
                const canScroll = maxScroll > 12;

                // 1. Cập nhật thanh tiến trình đọc
                if (readingProgressTrack && readingProgressBar) {
                    if (canScroll) {
                        readingProgressTrack.classList.add('is-visible');
                        const percent = Math.min(Math.max((scrollTop / maxScroll) * 100, 0), 100);
                        readingProgressBar.style.width = percent.toFixed(1) + '%';
                    } else {
                        readingProgressTrack.classList.remove('is-visible');
                        readingProgressBar.style.width = '0%';
                    }
                }

                // 3. Lớp fade ở đáy thư: Hiện khi còn nội dung, mờ dần khi chạm đáy
                if (letterBottomFade) {
                    const atBottom = !canScroll || (scrollTop >= maxScroll - 6);
                    letterBottomFade.style.opacity = atBottom ? '0' : '1';
                }

                // 4. Nút gợi ý cuộn xuống: Hiện khi ở đoạn đầu và có nội dung tràn, ẩn khi đã cuộn sâu hoặc chạm đáy
                if (scrollDownCue) {
                    const showCue = canScroll && scrollTop < 35 && !autoScrollActive;
                    scrollDownCue.classList.toggle('is-visible', showCue);
                }
            }

            // Khởi động cuộn tự động mượt mà bằng requestAnimationFrame (Chuẩn 60-120Hz)
            function startAutoScroll() {
                if (autoScrollActive || !isOpen || isAnimating || isUserInteracting) return;
                if (!letterScrollBody) return;

                const maxScroll = letterScrollBody.scrollHeight - letterScrollBody.clientHeight;
                if (maxScroll <= 12 || letterScrollBody.scrollTop >= maxScroll - 4) {
                    return;
                }

                autoScrollActive = true;
                lastRafTime = performance.now();
                accumulatedScroll = letterScrollBody.scrollTop;
                if (scrollDownCue) scrollDownCue.classList.remove('is-visible');

                function step(now) {
                    if (!autoScrollActive || !isOpen || isAnimating || isUserInteracting) {
                        autoScrollActive = false;
                        return;
                    }

                    const dt = Math.min((now - lastRafTime) / 1000, 0.1);
                    lastRafTime = now;

                    accumulatedScroll += SCROLL_SPEED_PX_SEC * dt;
                    const currentMax = letterScrollBody.scrollHeight - letterScrollBody.clientHeight;

                    if (accumulatedScroll >= currentMax - 1) {
                        letterScrollBody.scrollTop = currentMax;
                        stopAutoScroll();
                        updateScrollMetrics();
                        return;
                    }

                    letterScrollBody.scrollTop = Math.round(accumulatedScroll);
                    updateScrollMetrics();
                    autoScrollRafId = requestAnimationFrame(step);
                }

                autoScrollRafId = requestAnimationFrame(step);
            }

            // Dừng cuộn tự động
            function stopAutoScroll() {
                autoScrollActive = false;
                if (autoScrollRafId) {
                    cancelAnimationFrame(autoScrollRafId);
                    autoScrollRafId = null;
                }
                clearTimeout(autoScrollTimer);
            }

            // Lập lịch kích hoạt cuộn tự động sau khoảng thời gian không tương tác (Chỉ áp dụng khi nội dung đủ dài)
            function scheduleAutoScroll(delayMs) {
                clearTimeout(autoScrollTimer);
                if (!isOpen || isAnimating || !letterScrollBody) return;
                const maxScroll = letterScrollBody.scrollHeight - letterScrollBody.clientHeight;
                if (maxScroll <= 12) return; // Nếu nội dung ngắn vừa vặn thì không cần tự cuộn
                autoScrollTimer = setTimeout(() => {
                    if (isOpen && !isAnimating && !isUserInteracting) {
                        startAutoScroll();
                    }
                }, delayMs);
            }

            // Sự kiện người dùng tương tác -> Ngừng cuộn tức thì (100% ưu tiên người dùng)
            function handleUserInteractionStart() {
                isUserInteracting = true;
                stopAutoScroll();
            }

            function handleUserInteractionEnd() {
                isUserInteracting = false;
                if (letterScrollBody) {
                    accumulatedScroll = letterScrollBody.scrollTop;
                    updateScrollMetrics();
                    const maxScroll = letterScrollBody.scrollHeight - letterScrollBody.clientHeight;
                    if (maxScroll > 12 && letterScrollBody.scrollTop < maxScroll - 8) {
                        scheduleAutoScroll(RESUME_IDLE_DELAY);
                    }
                }
            }

            // Khởi tạo trạng thái ban đầu của thư và nắp:
            // Thư nằm gọn 100% bên trong lòng túi: scale nhỏ gọn vừa vặn, đáy cách xa đáy bao thư, không bao giờ lộ góc dưới
            const isMobileInit = window.innerWidth <= 640;
            const scaleInsideInit = isMobileInit ? 0.44 : 0.54;
            const yInsideInit = isMobileInit ? -5 : -10;

            gsap.set(letterPaper, {
                xPercent: -50,
                yPercent: -50,
                x: 0,
                y: yInsideInit,
                z: 4,
                scale: scaleInsideInit,
                opacity: 0,
                zIndex: 5,
                transformOrigin: "center center"
            });

            // Nắp thư đóng kín ở mặt trước: rotateX: 0, z: 25, zIndex: 25
            gsap.set(flapTop, {
                rotateX: 0,
                z: 25,
                zIndex: 25,
                transformOrigin: "top center"
            });

            function triggerConfettiBurst() {
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 36,
                        spread: 68,
                        origin: {
                            y: 0.54
                        },
                        colors: currentTheme.confettiColors || ['#ff4081', '#ff80ab', '#ffffff'],
                        scalar: 1.05,
                        shapes: ['circle']
                    });
                }
            }

            // MỞ BAO THƯ (TỐI ƯU HÓA HOÀN TOÀN BẰNG GPU COMPOSITING: ZERO REFLOW -> 60-120FPS)
            // QUY TRÌNH: NẰM GỌN TRONG BAO -> TRỒI LÊN TRÊN KHỎI MIỆNG TÚI -> BƯỚC RA TRƯỚC HIỂN THỊ
            // TUYỆT ĐỐI KHÔNG BAO GIỜ BỊ LỘ RA Ở GÓC DƯỚI BAO THƯ
            function openEnvelope() {
                if (isOpen || isAnimating) return;
                isAnimating = true;
                initAudio();
                playPopSound();
                if (window.musicManager && typeof window.musicManager.play === 'function' && window.musicManager.audio) {
                    window.musicManager.play();
                } else {
                    startBackgroundMusic();
                }

                gsap.killTweensOf([letterPaper, flapTop, envelopeBox, envFloorShadow, letterBackdrop, sealBtn, hintPill,
                    envFloatingRig
                ]);

                // Đưa góc nghiêng chuột về 0 một cách êm ái
                if (envFloatingRig) {
                    envFloatingRig.classList.add('is-paused');
                    gsap.to(envFloatingRig, {
                        rotateX: 0,
                        rotateY: 0,
                        duration: 0.22,
                        ease: "power2.out"
                    });
                }
                targetRotX = 0;
                targetRotY = 0;
                currentRotX = 0;
                currentRotY = 0;

                const isLandscapeMobile = window.innerHeight <= 520 && window.innerWidth > window.innerHeight;
                const isMobile = window.innerWidth <= 640 || isLandscapeMobile;
                const scaleInside = isLandscapeMobile ? 0.46 : (isMobile ? 0.44 : 0.54);
                const yInside = isLandscapeMobile ? -4 : (isMobile ? -5 : -10);
                const envDropY = isLandscapeMobile ? 12 : (isMobile ? 22 : 28);
                const letterTargetY = isLandscapeMobile ? -10 : (isMobile ? -48 : -42);
                const slideUpY = isLandscapeMobile ? -75 : (isMobile ? -120 : -135);

                const flapFront = flapTop.querySelector('.flap-face-front');
                const flapBack = flapTop.querySelector('.flap-face-back');

                const tl = gsap.timeline({
                    onComplete: () => {
                        isOpen = true;
                        isAnimating = false;
                        letterPaper.style.pointerEvents = 'auto';
                        letterScrollBody.scrollTop = 0;
                        accumulatedScroll = 0;
                        if (window.SmartMessageTypography) window.SmartMessageTypography.fitContent();
                        updateScrollMetrics();
                        playChimeSound();
                        triggerConfettiBurst();
                        scheduleAutoScroll(INITIAL_IDLE_DELAY);
                    }
                });

                // BƯỚC 1: Con dấu và ngón tay hint tan biến nhanh gọn
                tl.to([sealBtn, hintPill], {
                    scale: 0.4,
                    opacity: 0,
                    duration: 0.16,
                    ease: "power2.in",
                    onComplete: () => {
                        sealBtn.style.pointerEvents = 'none';
                        hintPill.style.display = 'none';
                    }
                }, 0);

                // BƯỚC 2: Mở nắp thư lật 180 độ lên trên ra phía sau
                tl.to(flapTop, {
                    rotateX: 180,
                    duration: 0.38,
                    ease: "power2.inOut",
                    transformOrigin: "top center"
                }, 0.10);

                // Tại điểm 90 độ lật qua phía sau: Flap chuyển thành mặt trong và lùi ra phía sau bao thư (z: -5, zIndex: 2)
                // Đảm bảo nắp gập hoàn toàn ở đằng sau lá thư, không bao giờ đè hay che khuất lá thư
                tl.call(() => {
                    flapTop.style.zIndex = '2';
                    gsap.set(flapTop, {
                        z: -5
                    });
                    if (flapFront) flapFront.style.opacity = '0';
                    if (flapBack) flapBack.style.opacity = '1';
                }, null, 0.28);

                // Backdrop mờ tối sang trọng xuất hiện đồng thời
                tl.to(letterBackdrop, {
                    opacity: 1,
                    duration: 0.42,
                    ease: "power2.out",
                    onStart: () => {
                        letterBackdrop.style.pointerEvents = 'auto';
                    }
                }, 0.10);

                // BƯỚC 3: LÁ THƯ TỪ TRONG BAO TRỒI LÊN TRÊN (ra từ ở trong bao xong đi lên)
                // Bắt đầu từ yInside (-10px/-5px) cách đáy bao thư 20-52px, tuyệt đối KHÔNG ló ra góc dưới
                tl.set(letterPaper, {
                    zIndex: 5,
                    z: 6,
                    y: yInside,
                    scale: scaleInside
                }, 0.26);

                tl.to(letterPaper, {
                    opacity: 1,
                    duration: 0.12
                }, 0.26);

                // Trượt vút lên cao thoát ra khỏi miệng túi
                tl.to(letterPaper, {
                    y: slideUpY,
                    scale: 0.95,
                    duration: 0.38,
                    ease: "power2.out"
                }, 0.26);

                // BƯỚC 4: HIỂN THỊ RA VỊ TRÍ ĐỌC PHÍA TRƯỚC (và hiển thị ra)
                // Khi lá thư đã trồi lên cao khỏi miệng túi: Đưa ra trước hoàn toàn (zIndex: 500, z: 60)
                tl.set(letterPaper, {
                    zIndex: 500,
                    z: 60,
                    pointerEvents: 'auto'
                }, 0.64);

                // Lá thư đỗ êm ái xuống vị trí trung tâm để hiển thị rõ ràng, sang trọng
                tl.to(letterPaper, {
                    y: letterTargetY,
                    scale: 1,
                    z: 60,
                    duration: 0.42,
                    ease: "back.out(1.12)"
                }, 0.64);

                // Bao thư đồng thời hạ nhẹ xuống dưới làm bệ đỡ phía sau
                tl.to(envelopeBox, {
                    y: envDropY,
                    scale: 0.94,
                    duration: 0.42,
                    ease: "power2.out"
                }, 0.64);

                // Bóng mặt đất co nhẹ theo bao thư
                tl.to(envFloorShadow, {
                    scale: 0.90,
                    opacity: 0.75,
                    duration: 0.42,
                    ease: "power2.out"
                }, 0.64);
            }

            // ĐÓNG THƯ (GẤP LẠI VÀO BAO THƯ - CHUYỂN ĐỘNG LIỀN MẠCH, ZERO GIẬT LỖI)
            // QUY TRÌNH NGƯỢC LẠI: NHẤC LÊN MIỆNG TÚI -> TRƯỢT VÀO LÒNG BAO (DỪNG TẠI yInside) -> NẮP GẬP ĐÓNG -> KHÓA DẤU SÁP
            function closeEnvelope() {
                if (!isOpen || isAnimating) return;
                isAnimating = true;
                initAudio();
                playPopSound();

                gsap.killTweensOf([letterPaper, flapTop, envelopeBox, envFloorShadow, letterBackdrop, sealBtn,
                    hintPill]);
                letterPaper.style.pointerEvents = 'none';
                stopAutoScroll();
                if (scrollDownCue) scrollDownCue.classList.remove('is-visible');
                if (readingProgressBar) readingProgressBar.style.width = '0%';
                if (readingProgressTrack) readingProgressTrack.classList.remove('is-visible');
                if (letterBottomFade) letterBottomFade.style.opacity = '0';

                const isLandscapeMobile = window.innerHeight <= 520 && window.innerWidth > window.innerHeight;
                const isMobile = window.innerWidth <= 640 || isLandscapeMobile;
                const scaleInside = isLandscapeMobile ? 0.46 : (isMobile ? 0.44 : 0.54);
                const yInside = isLandscapeMobile ? -4 : (isMobile ? -5 : -10);
                const slideUpY = isLandscapeMobile ? -75 : (isMobile ? -120 : -135);

                const flapFront = flapTop.querySelector('.flap-face-front');
                const flapBack = flapTop.querySelector('.flap-face-back');

                // Đưa cuộn thư về đầu ngay tức khắc
                letterScrollBody.scrollTop = 0;

                const tl = gsap.timeline({
                    onComplete: () => {
                        isOpen = false;
                        isAnimating = false;
                        if (envFloatingRig) {
                            envFloatingRig.classList.remove('is-paused');
                        }
                    }
                });

                // BƯỚC 1: Backdrop mờ dần, bao thư trôi về vị trí trung tâm
                tl.to(letterBackdrop, {
                    opacity: 0,
                    duration: 0.35,
                    ease: "power2.inOut",
                    onComplete: () => {
                        letterBackdrop.style.pointerEvents = 'none';
                    }
                }, 0);

                tl.to(envelopeBox, {
                    y: 0,
                    scale: 1,
                    duration: 0.35,
                    ease: "power2.out"
                }, 0);

                tl.to(envFloorShadow, {
                    scale: 1,
                    opacity: 1,
                    duration: 0.35,
                    ease: "power2.out"
                }, 0);

                // BƯỚC 2: QUY TRÌNH ĐÓNG NGƯỢC LẠI
                // 2.1. Lá thư từ vị trí đọc nhấc nhẹ lên trên miệng túi
                tl.to(letterPaper, {
                    y: slideUpY,
                    scale: 0.95,
                    duration: 0.28,
                    ease: "power2.inOut"
                }, 0);

                // 2.2. Đưa lá thư vào lại bên trong miệng túi (zIndex: 5, z: 6)
                tl.set(letterPaper, {
                    zIndex: 5,
                    z: 6
                }, 0.28);

                // 2.3. Lá thư trượt thẳng xuống sâu vào lòng bao thư, DỪNG LẠI TẠI yInside (cách đáy 20-52px, KHÔNG lộ đáy)
                tl.to(letterPaper, {
                    y: yInside,
                    scale: scaleInside,
                    z: 4,
                    duration: 0.35,
                    ease: "power2.in"
                }, 0.28);

                // Khi thư đã lọt an toàn vào lòng bao thư: mờ dần và ẩn
                tl.to(letterPaper, {
                    opacity: 0,
                    duration: 0.16,
                    ease: "power2.in"
                }, 0.45);

                // BƯỚC 3: NẮP THƯ GẬP TỪ SAU RA TRƯỚC ĐẬY KÍN BAO THƯ
                tl.to(flapTop, {
                    rotateX: 0,
                    duration: 0.40,
                    ease: "power2.inOut",
                    transformOrigin: "top center"
                }, 0.48);

                // Khi nắp lật qua 90 độ trở về mặt trước: đưa zIndex và z ra phía trước (z: 25, zIndex: 25)
                tl.call(() => {
                    flapTop.style.zIndex = '25';
                    gsap.set(flapTop, {
                        z: 25
                    });
                    if (flapFront) flapFront.style.opacity = '1';
                    if (flapBack) flapBack.style.opacity = '0';
                }, null, 0.68);

                // BƯỚC 4: Con dấu sáp & gợi ý chạm xuất hiện nảy nhẹ (back.out) khóa nắp thư
                tl.add(() => {
                    hintPill.style.display = 'flex';
                }, 0.74);

                tl.to([sealBtn, hintPill], {
                    scale: 1,
                    opacity: 1,
                    z: 35,
                    duration: 0.28,
                    ease: "back.out(1.5)",
                    onStart: () => {
                        sealBtn.style.pointerEvents = 'auto';
                    }
                }, 0.74);
            }

            // SỰ KIỆN MỞ THƯ
            sealBtn.addEventListener('click', openEnvelope);
            envelopeBox.addEventListener('click', function(e) {
                if (!isOpen && !isAnimating) {
                    openEnvelope();
                }
            });

            // XỬ LÝ ĐÓNG THƯ TỨC THÌ TRÊN CẢ DESKTOP LẪN MOBILE
            let lastCloseTime = 0;

            function handleCloseLetter(e) {
                if (e) {
                    e.stopPropagation();
                }
                const now = Date.now();
                if (now - lastCloseTime < 350) return;
                lastCloseTime = now;
                closeEnvelope();
            }

            // SỰ KIỆN ĐÓNG THƯ TỪ NÚT BẤM (✕)
            btnCloseLetter.addEventListener('click', handleCloseLetter);
            btnCloseLetter.addEventListener('touchend', handleCloseLetter, {
                passive: true
            });

            // SỰ KIỆN CHẠM/CLICK VÀO NỀN MỜ BACKDROP ĐỂ ĐÓNG THƯ
            letterBackdrop.addEventListener('click', handleCloseLetter);
            letterBackdrop.addEventListener('touchend', handleCloseLetter, {
                passive: true
            });

            // SỰ KIỆN CLICK / CHẠM RA NGOÀI TRÊN SÂN KHẤU ĐỂ ĐÓNG THƯ
            let touchStartX = 0;
            let touchStartY = 0;
            stage.addEventListener('touchstart', function(e) {
                if (e.touches && e.touches[0]) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }
            }, {
                passive: true
            });

            stage.addEventListener('touchend', function(e) {
                if (isOpen && !isAnimating) {
                    if (e.changedTouches && e.changedTouches[0]) {
                        const dx = Math.abs(e.changedTouches[0].clientX - touchStartX);
                        const dy = Math.abs(e.changedTouches[0].clientY - touchStartY);
                        if (dx > 12 || dy > 12) return; // Cử chỉ vuốt/cuộn, không đóng thư
                    }
                    if (!letterPaper.contains(e.target)) {
                        handleCloseLetter(e);
                    }
                }
            }, {
                passive: true
            });

            stage.addEventListener('click', function(e) {
                if (isOpen && !isAnimating) {
                    if (!letterPaper.contains(e.target)) {
                        handleCloseLetter(e);
                    }
                }
            });

            // BẢO VỆ CUỘN & TƯƠNG TÁC BÊN TRONG LÁ THƯ
            letterPaper.addEventListener('click', function(e) {
                e.stopPropagation();
            });
            letterPaper.addEventListener('touchend', function(e) {
                e.stopPropagation();
            }, {
                passive: true
            });

            // LẮNG NGHE TƯƠNG TÁC CUỘN / CHẠM ĐỂ TỰ ĐỘNG DỪNG VÀ TIẾP TỤC CUỘN MƯỢT MÀ
            letterScrollBody.addEventListener('touchstart', handleUserInteractionStart, {
                passive: true
            });
            letterScrollBody.addEventListener('touchend', handleUserInteractionEnd, {
                passive: true
            });
            letterScrollBody.addEventListener('pointerdown', handleUserInteractionStart, {
                passive: true
            });
            letterScrollBody.addEventListener('pointerup', handleUserInteractionEnd, {
                passive: true
            });

            letterScrollBody.addEventListener('wheel', () => {
                handleUserInteractionStart();
                clearTimeout(wheelIdleTimer);
                wheelIdleTimer = setTimeout(() => {
                    handleUserInteractionEnd();
                }, 350);
            }, {
                passive: true
            });

            letterScrollBody.addEventListener('scroll', () => {
                if (!autoScrollActive) {
                    accumulatedScroll = letterScrollBody.scrollTop;
                    updateScrollMetrics();
                    if (!isUserInteracting) {
                        clearTimeout(autoScrollTimer);
                        const maxScroll = letterScrollBody.scrollHeight - letterScrollBody.clientHeight;
                        if (maxScroll > 12 && letterScrollBody.scrollTop < maxScroll - 8) {
                            scheduleAutoScroll(RESUME_IDLE_DELAY);
                        }
                    }
                }
            }, {
                passive: true
            });

            // NHẤN NÚT "CUỘN XUỐNG" ĐỂ CUỘN NHANH VÀ KHÁM PHÁ NỘI DUNG DƯỚI
            if (scrollDownCue) {
                scrollDownCue.addEventListener('click', (e) => {
                    e.stopPropagation();
                    stopAutoScroll();
                    letterScrollBody.scrollBy({
                        top: 120,
                        behavior: 'smooth'
                    });
                    setTimeout(() => {
                        handleUserInteractionEnd();
                    }, 450);
                });
            }

            // TỰ ĐỘNG THÍCH ỨNG TỌA ĐỘ VỊ TRÍ KHI XOAY NGANG / DỌC ĐIỆN THOẠI
            window.addEventListener('resize', function() {
                if (window.SmartTitleEngine) window.SmartTitleEngine.adjustTypography();
                if (window.SmartMessageTypography) window.SmartMessageTypography.fitContent();
                if (isOpen && !isAnimating) {
                    const isLandscape = window.innerHeight <= 520 && window.innerWidth > window.innerHeight;
                    const isMob = window.innerWidth <= 640 || isLandscape;
                    const targetY = isLandscape ? -10 : (isMob ? -48 : -42);
                    const dropY = isLandscape ? 12 : (isMob ? 22 : 28);
                    gsap.to(letterPaper, {
                        y: targetY,
                        duration: 0.24,
                        ease: "power2.out"
                    });
                    gsap.to(envelopeBox, {
                        y: dropY,
                        duration: 0.24,
                        ease: "power2.out"
                    });
                    updateScrollMetrics();
                }
            }, {
                passive: true
            });

            // Tự động tính toán lại khi phông chữ tải xong hoặc nội dung thư thay đổi linh hoạt
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => {
                    if (window.SmartTitleEngine) window.SmartTitleEngine.adjustTypography();
                    if (window.SmartMessageTypography) window.SmartMessageTypography.fitContent();
                    if (isOpen) updateScrollMetrics();
                });
            }

            if (window.ResizeObserver && letterScrollBody) {
                const contentResizeObserver = new ResizeObserver(() => {
                    if (isOpen) updateScrollMetrics();
                });
                contentResizeObserver.observe(letterScrollBody);
                const letterMsgEl = document.getElementById('displayMessage');
                if (letterMsgEl) contentResizeObserver.observe(letterMsgEl);
            }

        })();
    </script>


    <script>
        const musicManager = {
            audio: null,
            isUnlocked: false,
            isAttemptingPlay: false,
            state: 'idle',
            tokenData: null,
            _unlockEvents: ['touchstart', 'click', 'keydown', 'mousemove'],
            _unlockHandlerRef: null,

            _startAutoplayBypass() {
                if (this.isUnlocked || !this.audio) return;

                this._unlockHandlerRef = this._unlockHandler.bind(this);

                this._unlockEvents.forEach(eventName => {
                    document.addEventListener(eventName, this._unlockHandlerRef, {
                        passive: true
                    });
                });

                console.log("Bypass Autoplay: Đang lắng nghe tương tác người dùng để mở khóa âm thanh...");
            },

            _unlockHandler() {

                if (this.isUnlocked || this.isAttemptingPlay) return;

                this.isAttemptingPlay = true;

                this.audio.play().then(() => {

                    console.log("Bypass Autoplay: Âm thanh đã được mở khóa thành công!");
                    this.isUnlocked = true;

                    this._unlockEvents.forEach(eventName => {
                        document.removeEventListener(eventName, this._unlockHandlerRef);
                    });
                }).catch(error => {

                }).finally(() => {
                    this.isAttemptingPlay = false;
                });
            },

            _setupAudio(sourceUrl = null) {
                let audioSrc = sourceUrl || window.dataLetterV14?.data?.backgroundMusic || window.dataLetterV10?.data
                    ?.backgroundMusic;
                if (!audioSrc) {
                    audioSrc = './music.mp3';
                    console.warn("Không tìm thấy cấu hình nhạc, sử dụng nhạc mặc định.");
                }
                this.audio = new Audio(audioSrc);
                const isCrossOrigin = /^(https?:)?\/\//.test(audioSrc) && new URL(audioSrc).origin !== window.location
                    .origin;
                if (isCrossOrigin) {
                    this.audio.crossOrigin = "anonymous";
                }
                this.audio.loop = true;
                this.audio.volume = 0.7;
                this.attachEventListeners();
                this.updateState('ready');
            },

            async init() {
                const musicConfig = window.dataLetterV14?.data || window.dataLetterV10?.data;
                this.updateState('loading');

                if (!musicConfig) {
                    console.warn("Không tìm thấy dữ liệu nhạc. Sử dụng nhạc hệ thống dự phòng.");
                    this._setupAudio();
                } else if (musicConfig.type_music === 'system' || musicConfig.type_music === 'link') {
                    this._setupAudio(musicConfig.backgroundMusic);
                } else if (musicConfig.type_music === 'zing' && musicConfig.music_id) {
                    try {
                        const res = await this.fetchWithAuth(`/get-song?id=${musicConfig.music_id}`);
                        if (!res.ok) throw new Error(`Response not OK: ${res.status}`);
                        const songInfo = await res.json();
                        const mp3Url = songInfo.stream?.['128'];

                        if (mp3Url) {
                            this._setupAudio(mp3Url);
                        } else {
                            console.error('Không tìm thấy link MP3 128kbps, dùng nhạc dự phòng.');
                            this._setupAudio();
                        }
                    } catch (error) {
                        console.error('Lỗi khi lấy nhạc từ Zing:', error);
                        this.updateState('error');
                        this._setupAudio();
                    }
                } else {
                    this._setupAudio();
                }

                this._startAutoplayBypass();
            },

            play() {
                if (!this.audio || this.state === 'loading') {
                    return Promise.reject(new Error("Audio chưa sẵn sàng."));
                }
                if (!this.audio.paused) {
                    return Promise.resolve();
                }
                const playPromise = this.audio.play();
                playPromise.then(() => {
                    this.isUnlocked = true;
                    this.updateState('playing');
                }).catch(error => {
                    if (error.name === 'NotAllowedError') {
                        this.updateState('paused');
                    } else {
                        this.updateState('error');
                    }
                });
                return playPromise;
            },

            togglePlayback() {
                if (!this.audio || this.state === 'loading') {
                    console.warn("Nhạc chưa sẵn sàng.");
                    return;
                }

                if (!this.isUnlocked) {
                    this.isUnlocked = true;
                }

                if (this.audio.paused) {
                    this.play();
                } else {
                    this.audio.pause();
                }
            },

            updateState(newState) {
                this.state = newState;
                this.updateUI();
            },

            updateUI() {
                const audioIcon = document.getElementById('audio-icon');
                const audioBtn = document.getElementById('toggle-audio');
                if (!audioIcon) return;
                if (!this.audio || this.audio.paused) {
                    audioIcon.classList.remove("fa-volume-high");
                    audioIcon.classList.add("fa-volume-xmark");
                    if (audioBtn) audioBtn.classList.remove("playing");
                } else {
                    audioIcon.classList.remove("fa-volume-xmark");
                    audioIcon.classList.add("fa-volume-high");
                    if (audioBtn) audioBtn.classList.add("playing");
                }
            },

            attachEventListeners() {
                if (!this.audio) return;
                this.audio.onplay = () => this.updateState('playing');
                this.audio.onpause = () => this.updateState('paused');
                this.audio.onvolumechange = () => this.updateUI();
            },

            async getToken() {
                try {
                    const res = await fetch('/token-api-mp3');
                    if (!res.ok) throw new Error('Không lấy được token');
                    this.tokenData = await res.json();
                    return this.tokenData;
                } catch (err) {
                    console.error('Lỗi lấy token:', err);
                    return null;
                }
            },

            async fetchWithAuth(url) {
                if (!this.tokenData) {
                    await this.getToken();
                }
                if (!this.tokenData) throw new Error('Không có token xác thực');

                const headers = {
                    'X-Auth-Token': this.tokenData.token,
                    'X-Auth-Timestamp': this.tokenData.timestamp,
                    'X-Client-Key': this.tokenData.clientKey,
                    'X-Auth-Nonce': this.tokenData.nonce,
                };

                let res = await fetch(url, {
                    headers
                });

                if (res.status === 401 || res.status === 403) {
                    console.log("Token có thể đã hết hạn, làm mới token...");
                    await this.getToken();
                    if (!this.tokenData) throw new Error('Không lấy được token mới');

                    const newHeaders = {
                        'X-Auth-Token': this.tokenData.token,
                        'X-Auth-Timestamp': this.tokenData.timestamp,
                        'X-Client-Key': this.tokenData.clientKey,
                        'X-Auth-Nonce': this.tokenData.nonce,
                    };
                    res = await fetch(url, {
                        headers: newHeaders
                    });
                }

                if (!res.ok) {
                    const errorText = await res.text();
                    throw new Error(`Request lỗi sau khi thử lại: ${res.status} - ${errorText}`);
                }
                return res;
            }
        };

        document.addEventListener('DOMContentLoaded', () => {

            window.musicManager = musicManager;

            musicManager.init();

            const toggleBtn = document.getElementById("toggle-audio");
            if (toggleBtn) {
                toggleBtn.addEventListener("click", () => musicManager.togglePlayback());
            }
            const fullscreenManager = {
                toggleBtn: document.getElementById('toggle-fullscreen'),
                iconElement: document.getElementById('fullscreen-icon'),
                isFullscreen: function() {
                    return !!(document.fullscreenElement || document.webkitFullscreenElement || document
                        .mozFullScreenElement || document.msFullscreenElement);
                },
                updateIcon: function() {
                    if (!this.iconElement) return;

                    if (this.isFullscreen()) {
                        this.iconElement.classList.remove('fa-expand');
                        this.iconElement.classList.add('fa-compress');
                    } else {
                        this.iconElement.classList.remove('fa-compress');
                        this.iconElement.classList.add('fa-expand');
                    }
                },
                toggle: function() {
                    if (!this.isFullscreen()) {
                        const element = document.documentElement;
                        if (element.requestFullscreen) {
                            element.requestFullscreen();
                        } else if (element.mozRequestFullScreen) {
                            element.mozRequestFullScreen();
                        } else if (element.webkitRequestFullscreen) {
                            element.webkitRequestFullscreen();
                        } else if (element.msRequestFullscreen) {
                            element.msRequestFullscreen();
                        }
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        } else if (document.mozCancelFullScreen) {
                            document.mozCancelFullScreen();
                        } else if (document.webkitExitFullscreen) {
                            document.webkitExitFullscreen();
                        } else if (document.msExitFullscreen) {
                            document.msExitFullscreen();
                        }
                    }
                },
                init: function() {
                    if (this.toggleBtn) {
                        this.toggleBtn.addEventListener('click', () => this.toggle());
                        document.addEventListener('fullscreenchange', () => this.updateIcon());
                        document.addEventListener('webkitfullscreenchange', () => this.updateIcon());
                        document.addEventListener('mozfullscreenchange', () => this.updateIcon());
                        document.addEventListener('MSFullscreenChange', () => this.updateIcon());
                    }
                }
            };
            fullscreenManager.init();
        });
    </script>
